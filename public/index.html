<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotes API</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main { width: min(560px, 90vw); text-align: center; }
      h1 { font-size: 1rem; letter-spacing: .18em; text-transform: uppercase; color: #64748b; }
      blockquote { font-size: 1.6rem; line-height: 1.45; margin: 1.5rem 0 .5rem; }
      cite { color: #94a3b8; font-style: normal; }
      button {
        margin-top: 2rem;
        padding: .7rem 1.4rem;
        font: inherit;
        color: #0f172a;
        background: #38bdf8;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover { background: #7dd3fc; }
    </style>
  </head>
  <body>
    <main>
      <h1>Quotes API</h1>
      <blockquote id="text">Loading…</blockquote>
      <cite id="author"></cite>
      <br />
      <button id="next" type="button">Another one</button>
    </main>
    <script>
      const textEl = document.getElementById('text');
      const authorEl = document.getElementById('author');

      async function loadQuote() {
        try {
          const res = await fetch('/api/quotes/random');
          const quote = await res.json();
          textEl.textContent = `“${quote.text}”`;
          authorEl.textContent = `— ${quote.author}`;
        } catch {
          textEl.textContent = 'Could not reach the API.';
          authorEl.textContent = '';
        }
      }

      document.getElementById('next').addEventListener('click', loadQuote);
      loadQuote();
    </script>
  </body>
</html>
